name: Import legacy feed

# One time snapshot of the current Spotify for Creators (anchor.fm) feed.
# Run manually: Actions, Import legacy feed, Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current feed
        run: |
          mkdir -p podcast
          curl -fsSL --retry 3 "https://anchor.fm/s/117b5bdec/podcast/rss" -o podcast/legacy.xml
          echo "Items: $(grep -c '<item>' podcast/legacy.xml)"
          ls -la podcast/legacy.xml

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast/legacy.xml
          git diff --cached --quiet || git commit -m "Snapshot legacy feed"
          git push
